<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- macOS app icon grid: an 824 px tile with 100 px margin -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a33"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d4531a"/>
      <stop offset="1" stop-color="#ffb066"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.66" cy="0.36" r="0.42">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <!-- pixels, growing in brightness towards the spark -->
  <g>
    <rect x="236" y="632" width="92" height="92" rx="14" fill="#ff8a3d" opacity="0.22"/>
    <rect x="348" y="632" width="92" height="92" rx="14" fill="#ff8a3d" opacity="0.4"/>
    <rect x="460" y="632" width="92" height="92" rx="14" fill="#ff8a3d" opacity="0.62"/>
    <rect x="236" y="520" width="92" height="92" rx="14" fill="#ff8a3d" opacity="0.36"/>
    <rect x="348" y="520" width="92" height="92" rx="14" fill="url(#ember)" opacity="0.78"/>
    <rect x="236" y="408" width="92" height="92" rx="14" fill="#ff8a3d" opacity="0.5"/>
    <rect x="460" y="520" width="92" height="92" rx="14" fill="url(#ember)"/>
    <rect x="348" y="408" width="92" height="92" rx="14" fill="url(#ember)"/>
  </g>

  <!-- the spark: four points, a bright core -->
  <path d="M676 216 C 690 330 714 354 828 368 C 714 382 690 406 676 520 C 662 406 638 382 524 368 C 638 354 662 330 676 216 Z" fill="url(#ember)"/>
  <path d="M676 300 C 683 352 692 361 744 368 C 692 375 683 384 676 436 C 669 384 660 375 608 368 C 660 361 669 352 676 300 Z" fill="#fff4e8"/>
</svg>
